 animado en La Paz, Bolivia",credit:"Shiwa Yachachin"},stadium:{id:26627808,alt:"Vista aérea de un estadio en La Paz rodeado de edificios",credit:"Wycher van Vliet"},condoriri:{id:19783220,alt:"Mujer con una mula en los Andes bolivianos (Condoriri)",credit:"Gabriel Ramos"},huayna:{id:18046333,alt:"Panorámica del Huayna Potosí con picos nevados",credit:"Gabriel Ramos"},chapel:{id:21614377,alt:"Capilla en el campo de Sucre rodeada de colinas",credit:"Robert Acevedo"},tarata:{id:23232284,alt:"Fachada histórica de iglesia en Cochabamba, Bolivia",credit:"Misk'i Marie"},kualaLumpur:{id:12267675,alt:"Vista aérea nocturna de Kuala Lumpur",credit:"Pok Rie"},nightCity:{id:37894521,alt:"Calles iluminadas de una ciudad vistas de noche desde el aire",credit:"Yunus Tuğ"},colombo:{id:36703583,alt:"Horizonte iluminado de Colombo de noche",credit:"Thilina Alagiyawanna"}},Yx={slug:"historia",title:"Historia de WiMAX: del estándar IEEE 802.16 a la era del 4G",kicker:"Historia",summary:"De un grupo de trabajo del IEEE en 1998 a redes de cientos de miles de usuarios en cinco continentes: así nació, creció y se retiró WiMAX.",hero:en.towerSilhouette,date:"2026-01-12",readMin:9,sources:[{label:"R. B. Marks (NIST), «IEEE 802.16 marks broadband wireless access maturation», 2002",url:"https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=33100"},{label:"Roger B. Marks — CV (IEEE 802.16 / WiMAX Forum)",url:"https://consensii.com/marks/Marks-CV.pdf"},{label:"WiMAX Forum — 519 despliegues en 146 países (2009)",url:"https://www.rfglobalnet.com/doc/wimax-deployments-go-global-with-519-in-146-0001"},{label:"UIT-D: Banda ancha en los países andinos (2014)",url:"https://www.itu.int/dms_pub/itu-d/opb/pref/D-PREF-EF.BB.ANDEAN-2014-PDF-S.pdf"},{label:"Wikipedia: WiMAX y Clearwire (fechas de cierre de la red)",url:"https://en.wikipedia.org/wiki/Clearwire"},{label:"Technical.ly: aviso de cierre de CLEAR 4G WiMAX (2015)",url:"https://technical.ly/diversity-equity-inclusion/clear-4g-network-shutdown/"},{label:"Silicon UK: «Tales in Tech History: WiMax»",url:"https://www.silicon.co.uk/networks/tales-tech-history-wimax-227889"}],blocks:[{k:"p",t:"WiMAX (Worldwide Interoperability for Microwave Access) fue, durante casi una década, la gran promesa de la banda ancha inalámbrica. Nació para resolver un problema muy concreto: llevar Internet a lugares donde tender cobre o fibra era demasiado caro. Su historia es también una lección sobre cómo la tecnología no siempre gana por ser la primera, sino por encajar mejor en el ecosistema industrial que la rodea."},{k:"h2",t:"Los orígenes: la «última milla» y el grupo IEEE 802.16"},{k:"p",t:"A finales de los años noventa, el mundo vivía el auge de Internet y de las telecomunicaciones, pero la llamada «última milla» —el tramo final entre la central del operador y el hogar del usuario— seguía siendo el eslabón más caro y lento. DSL y cable no llegaban a barrios periféricos ni a zonas rurales, y desplegar fibra suponía obras enormes. La radio parecía la respuesta natural."},{k:"p",t:"En 1998 el ingeniero Roger B. Marks, del Instituto Nacional de Estándares y Tecnología de EE. UU. (NIST) en Boulder, Colorado, impulsó la creación de un grupo de trabajo dentro del IEEE para estandarizar el acceso inalámbrico de banda ancha. Marks presidió ese grupo —el IEEE 802.16 Working Group on Broadband Wireless Access— y fue reelegido en numerosas ocasiones; su currículum lo describe como quien inició el grupo y lideró el desarrollo del estándar. El resultado fue una familia de normas conocida como «WirelessMAN», pensada para redes de área metropolitana."},{k:"quote",t:"El grupo de trabajo IEEE 802.16 se ha convertido en el punto focal de la industria mundial de acceso inalámbrico de banda ancha.",by:"Roger B. Marks, NIST, 2002 (traducción libre)"},{k:"img",img:en.towerDish,caption:"Las torres con enlaces de microondas fueron la base física de las primeras redes 802.16."},{k:"h2",t:"2001–2005: del primer estándar a WiMAX móvil"},{k:"h3",t:"IEEE 802.16-2001: línea de vista y frecuencias altas"},{k:"p",t:"La primera versión del estándar se aprobó a finales de 2001 y se publicó el 8 de abril de 2002. Definía un interfaz aéreo para acceso inalámbrico fijo en las bandas de 10 a 66 GHz, con modulación de portadora única y necesidad de línea de vista directa entre antenas. Era una tecnología pensada para conectar edificios y estaciones base, no aún al usuario doméstico."},{k:"h3",t:"El nacimiento del WiMAX Forum (junio de 2001)"},{k:"p",t:"Como ocurrió con Wi-Fi y la Wi-Fi Alliance, la industria creó un organismo para certificar la interoperabilidad. En junio de 2001 se formó el WiMAX Forum, y de allí surgió el propio nombre «WiMAX». Su misión: definir perfiles de sistema, probar equipos de distintos fabricantes y promover el estándar. Ron Resnick, ejecutivo de Intel, presidió el Foro desde 2004. Intel, además, fue uno de los grandes impulsores comerciales de la tecnología, con su propio negocio de módems de banda ancha inalámbrica creado en 2002."},{k:"h3",t:"802.16a y 802.16-2004: WiMAX fijo sin línea de vista"},{k:"p",t:"Entre 2003 y 2004 llegaron las enmiendas que hicieron viable el negocio: bandas de 2 a 11 GHz (incluidas las licenciadas de 2,5 y 3,5 GHz), operación sin línea de vista (NLOS) y modulación OFDM. Esta versión —conocida como «WiMAX fijo» o 802.16d— prometía alcances de varios kilómetros y velocidades teóricas de hasta 75 Mbps en canales de 20 MHz."},{k:"h3",t:"802.16e-2005: WiMAX móvil"},{k:"p",t:"A finales de 2005 se completó IEEE 802.16e, que añadió movilidad con traspaso (handoff) entre estaciones base y una capa física OFDMA escalable. Las primeras certificaciones de equipos del WiMAX Forum llegaron en esa misma época. Con 802.16e, WiMAX dejó de ser solo una alternativa al ADSL y pasó a competir en el terreno de los móviles."},{k:"table",caption:"Evolución del estándar IEEE 802.16",head:["Versión","Hito","Banda","Rasgo clave"],rows:[["802.16-2001","Aprobado 2001, publicado abril de 2002","10–66 GHz","Línea de vista, portadora única"],["802.16a (2003)","Enmienda para frecuencias menores","2–11 GHz","NLOS, OFDM"],["802.16-2004 (d)","«WiMAX fijo»","2,5 / 3,5 / 5,8 GHz","Acceso fijo, perfiles certificables"],["802.16e-2005","«WiMAX móvil»","2,3 / 2,5 / 3,5 GHz","Movilidad, OFDMA escalable"],["802.16m (2011)","«WiMAX 2», candidato IMT-Advanced","Varias","Hasta 1 Gbit/s en estaciones fijas"]]},{k:"h2",t:"2006–2010: el auge mundial"},{k:"p",t:"En 2006 Corea del Sur puso en marcha WiBro, una variante de WiMAX móvil de la que el propio estándar adoptó tecnología. Ese mismo año Sprint anunció que basaría su red móvil nacional en WiMAX, presentándola como la primera red «4G». En octubre de 2007 la Unión Internacional de Telecomunicaciones (UIT) incorporó WiMAX a la familia de tecnologías 3G (IMT-2000), tras un debate con reticencias de China y el apoyo de EE. UU. y otros países."},{k:"p",t:"Los números de esos años muestran el impulso: para diciembre de 2009 el WiMAX Forum registraba 519 despliegues en 146 países, 112 de ellos añadidos solo ese año. Yota, en Rusia, alcanzaba 250.000 usuarios activos; KT cubría más de la mitad de la población coreana y UQ Communications más de la mitad de la japonesa."},{k:"img",img:en.kualaLumpur,caption:"Malasia (Packet One) fue uno de los mercados asiáticos donde WiMAX ofreció servicio comercial."},{k:"fact",t:"El HTC EVO 4G, lanzado por Sprint en junio de 2010, fue el primer smartphone WiMAX de Estados Unidos. Ninguna generación de iPhone incorporó WiMAX: Apple esperó a LTE."},{k:"h2",t:"La guerra con LTE"},{k:"p",t:"El problema de WiMAX no fue técnico, sino industrial. LTE (Long Term Evolution) llegó más tarde, pero se presentó como una simple actualización de las redes GSM/UMTS ya desplegadas, mientras que WiMAX era una tecnología completamente nueva. Los grandes operadores móviles, que ya habían invertido miles de millones en 3G, prefirieron esperar. Como resumió el directivo de UK Broadband Nicholas James, «el problema de WiMAX fue el tiempo que tardó en ser móvil»."},{k:"p",t:"Verizon lanzó la primera red LTE nacional de EE. UU. en 2010 con velocidades muy superiores a las de WiMAX. En 2011 Sprint anunció que abandonaría WiMAX, y en el CES de enero de 2012 confirmó que dejaba de ofrecer dispositivos WiMAX. Proyecciones de la época, como la de Maravedis (unos 25 millones de abonados WiMAX a finales de 2011), pronto quedaron dominadas por las de LTE."},{k:"h2",t:"Declive y estado actual"},{k:"p",t:"Clearwire, el gran operador estadounidense con la marca CLEAR, llegó a servir 88 mercados y unos 11 millones de suscriptores (incluyendo mayoristas) en enero de 2012. Sprint terminó adquiriéndola y fue eliminando WiMAX: el 6 de noviembre de 2015 cesó el servicio CLEAR 4G, aunque la red siguió activa sin clientes comerciales hasta principios de marzo de 2016 por una orden judicial. En Rusia, Yota migró sus abonados a LTE desde 2011–2012."},{k:"p",t:"Hoy WiMAX sobrevive en nichos: pequeños operadores, redes industriales y ISPs rurales que mantienen equipos antiguos. Su herencia, sin embargo, es enorme: OFDMA, MIMO, QoS por flujo y modelos de red totalmente IP fueron ideas que LTE y 5G consolidaron. Incluso su espectro tiene una segunda vida: la banda de 3,5 GHz, que muchos países licitaron para WiMAX, es hoy la banda estrella del 5G. En 2025 Bolivia comenzó precisamente a asignar 3,5 GHz a Entel para su despliegue 5G."},{k:"fact",t:"El 6 de noviembre de 2015 Sprint apagó oficialmente CLEAR 4G, pero por orden judicial la red WiMAX siguió encendida —sin clientes— hasta marzo de 2016."},{k:"gallery",imgs:[en.towers,en.redTower,en.rooftop]}]},WM=[{name:"Roger B. Marks",initials:"RM",role:"Presidente del IEEE 802.16 Working Group (desde 1998)",org:"NIST / IEEE / WiMAX Forum",bio:"Inició el grupo de trabajo, fue elegido presidente diez veces y lideró el estándar 802.16. Más tarde fue vicepresidente de Tecnología y Estándares del WiMAX Forum (2009–2011) y coautor del libro «WirelessMAN».",tie:"Directo"},{name:"Ron Resnick",initials:"RR",role:"Presidente y Chairman del WiMAX Forum (desde 2004)",org:"Intel / WiMAX Forum",bio:"Ejecutivo de Intel que en junio de 2002 lanzó el negocio de banda ancha inalámbrica de la compañía, centrado en un módem WiMAX. Encabezó el Foro durante su etapa de mayor expansión.",tie:"Directo"},{name:"Craig McCaw",initials:"CM",role:"Pionero de la telefonía celular; impulsor de Clearwire",org:"Clearwire",bio:"Empresario estadounidense, fundador de McCaw Cellular, que apostó por el espectro de 2,5 GHz y por WiMAX como base de la red de Clearwire.",tie:"Directo"},{name:"Dan Hesse",initials:"DH",role:"CEO de Sprint (2007–2014)",org:"Sprint Nextel",bio:"Según la crónica de Clearwire, retomó en 2008 las negociaciones que dieron origen al joint venture con Google, Intel y otros socios. Bajo su mandato Sprint lanzó Xohm/CLEAR y después migró a LTE.",tie:"Directo"},{name:"Denis Sverdlov",initials:"DS",role:"Fundador de Yota (Scartel)",org:"Yota, Rusia",bio:"Su empresa construyó la mayor red WiMAX móvil del mundo: 250.000 usuarios activos a fines de 2009 y más de 300.000 en febrero de 2010, con expansión a Nicaragua, Perú y Bielorrusia.",tie:"Directo"},{name:"Andrew Viterbi",initials:"AV",role:"Cofundador de Qualcomm; creador del algoritmo de Viterbi",org:"Qualcomm / USC",bio:"Medalla Nacional de Ciencia (2008) y Medalla de Honor del IEEE (2010). Su algoritmo de decodificación es una pieza básica de las comunicaciones digitales inalámbricas. No se encontró evidencia de que participara en el diseño de WiMAX: su legado es CDMA y decodificación, no 802.16.",tie:"Indirecto"},{name:"David J. Farber",initials:"DF",role:"Científico de la computación y pionero de Internet",org:"Carnegie Mellon / Universidad de Pensilvania",bio:"Figura histórica de las redes de computadoras. En la investigación para este blog no se halló una fuente que lo vincule directamente con WiMAX, por lo que se lista solo como referente del contexto de redes.",tie:"Sin vínculo verificado"},{name:"Steve Jobs",initials:"SJ",role:"Cofundador y CEO de Apple",org:"Apple",bio:"No se encontró una declaración verificable de Jobs sobre WiMAX. Sí es un hecho comprobable que ningún iPhone incorporó WiMAX y que Apple adoptó LTE. Cualquier cita atribuida sin fuente primaria debe tomarse con cautela.",tie:"Sin vínculo verificado"}],$x={slug:"personajes",title:"Personajes clave: quiénes construyeron (y quiénes vieron pasar) WiMAX",kicker:"Personajes",summary:"Ingenieros del IEEE, directivos del WiMAX Forum y ejecutivos de Sprint y Clearwire: las personas detrás del estándar 802.16.",hero:en.switchGear,date:"2026-01-19",readMin:7,sources:[{label:"Roger B. Marks — CV oficial",url:"https://consensii.com/marks/Marks-CV.pdf"},{label:"Ron Resnick — perfil (presidente del WiMAX Forum desde 2004)",url:"https://vanceafbuptclass73-01.weebly.com/ron-resnick.html"},{label:"IEEE 802.16 — carta de enlace a Ron Resnick, 2008",url:"https://www.ieee802.org/16/liaison/docs/L80216-08_016.pdf"},{label:"Wikipedia: Clearwire",url:"https://en.wikipedia.org/wiki/Clearwire"},{label:"Wikipedia: Andrew Viterbi",url:"https://en.wikipedia.org/wiki/Andrew_Viterbi"},{label:"IEEE Spectrum — Medal of Honor 2010: Andrew J. Viterbi",url:"https://spectrum.ieee.org/2010-medal-of-honor-winner-andrew-j-viterbi"},{label:"Samsung / Yota — despliegue de Mobile WiMAX en Rusia (2010)",url:"https://www.samsung.com/global/business/networks/insights/press-release/samsung-and-yota-accelerate-nationwide-mobile-wimax-deployment-in-russia/"}],blocks:[{k:"p",t:"Ninguna tecnología nace sola. Detrás de WiMAX hubo tres comunidades que rara vez coinciden en una misma mesa: ingenieros que escriben estándares, ejecutivos que construyen consorcios y empresarios que apuestan miles de millones a una red. Este artículo recorre a los protagonistas verificables y aclara, con honestidad, a quiénes se suele asociar con WiMAX sin una base documental sólida."},{k:"h2",t:"Los ingenieros del IEEE: Roger B. Marks y el grupo 802.16"},{k:"p",t:"El nombre más importante del estándar es Roger B. Marks. Trabajaba en el NIST, en Boulder (Colorado), cuando en 1998 impulsó el grupo de trabajo que redactaría IEEE 802.16. Fue su presidente durante más de una década, organizó cerca de cien sesiones plenarias en países como Canadá, China, Egipto, Finlandia, India, Israel, Italia, Japón, Corea, Rusia, Singapur, España, Suiza, Taiwán y EE. UU. —con asistencias de hasta 462 personas— y lideró la gestión de las políticas de patentes del grupo."},{k:"p",t:"Marks también fue clave en la diplomacia técnica: encabezó los esfuerzos para que la UIT reconociera 802.16 como tecnología IMT-2000 y, después, como IMT-Advanced. Su currículum sostiene que el trabajo dio lugar a decenas de millones de dispositivos desplegados. En 2009 pasó al WiMAX Forum como vicepresidente de Tecnología y Estándares, donde dirigió la certificación de WiMAX móvil, y es coautor de «WirelessMAN: Inside the IEEE 802.16 Standard for Wireless Metropolitan Area Networks»."},{k:"img",img:en.repair,caption:"Detrás de cada red hay técnicos e instaladores: la parte menos visible de la historia de WiMAX."},{k:"h2",t:"Los líderes del WiMAX Forum"},{k:"p",t:"Mientras el IEEE definía la capa física y de enlace, el WiMAX Forum se encargaba de lo que el estándar deja abierto: perfiles, pruebas de interoperabilidad y marca. Ron Resnick, ejecutivo de Intel, presidió el Foro desde 2004. En Intel había lanzado en junio de 2002 el negocio de banda ancha inalámbrica de la empresa, con un módem de banda base para WiMAX. En una carta de marzo de 2008, el propio Marks se dirige a él como «Presidente, WiMAX Forum» para coordinar la respuesta a la UIT."},{k:"p",t:"El peso de Intel fue determinante: la compañía invirtió en Clearwire, integró radios WiMAX en portátiles y promovió el ecosistema de chips. Esa alianza entre estándar, fabricante de silicio y operador fue, a la vez, la fuerza y la debilidad de WiMAX."},{k:"h2",t:"Los ejecutivos: Sprint, Clearwire y Yota"},{k:"h3",t:"Craig McCaw y Clearwire"},{k:"p",t:"Clearwire, respaldada por el pionero celular Craig McCaw, acumuló espectro de 2,5 GHz y apostó por WiMAX. Llegó a operar en 88 mercados de EE. UU., con cobertura potencial de 134 millones de personas."},{k:"h3",t:"Dan Hesse y Sprint"},{k:"p",t:"Sprint y Clearwire anunciaron una alianza en julio de 2007 que se disolvió a finales de ese año. En 2008, el nuevo CEO de Sprint, Dan Hesse, retomó las conversaciones para formar una sociedad que atrajera capital de Google, Intel y otros. El resultado fue la marca CLEAR y la primera red WiMAX móvil de escala nacional en EE. UU. Años después, Sprint completó la adquisición y apagó WiMAX en 2015."},{k:"h3",t:"Denis Sverdlov y Yota"},{k:"p",t:"Fuera de EE. UU., el caso más notable es el de Yota, en Rusia. Su red pasó de tres ciudades (Moscú, San Petersburgo, Ufá) con más de 300.000 abonados en febrero de 2010 a planes de 180 ciudades y licencias en Nicaragua, Perú y Bielorrusia. Fue, durante un tiempo, la mayor red WiMAX móvil del planeta antes de migrar a LTE."},{k:"table",caption:"Resumen de personajes y su vínculo documentado con WiMAX",head:["Persona","Rol","Vínculo con WiMAX"],rows:[["Roger B. Marks","Chair IEEE 802.16; VP WiMAX Forum","Directo (estándar y certificación)"],["Ron Resnick","Presidente WiMAX Forum; Intel","Directo (consorcio e industria)"],["Craig McCaw","Impulsor de Clearwire","Directo (operador)"],["Dan Hesse","CEO de Sprint","Directo (operador)"],["Denis Sverdlov","Fundador de Yota","Directo (operador)"],["Andrew Viterbi","Cofundador de Qualcomm","Indirecto (teoría de decodificación)"],["David J. Farber","Pionero de Internet","Sin vínculo verificado"],["Steve Jobs","CEO de Apple","Sin declaración verificada"]]},{k:"h2",t:"Nota de verificación: Viterbi, Farber y Jobs"},{k:"p",t:"Al preparar este artículo se buscó activamente cualquier relación entre WiMAX y tres nombres célebres. El resultado: Andrew Viterbi, cofundador de Qualcomm, es el inventor del algoritmo que lleva su nombre y contribuyó de forma decisiva a CDMA; recibió la Medalla Nacional de Ciencia en 2008 y la Medalla de Honor del IEEE en 2010. Su algoritmo se usa en todos los estándares digitales 2G y 3G, y es habitual en la decodificación de códigos convolucionales de otros sistemas, pero no hay evidencia de que participara en el diseño de WiMAX."},{k:"p",t:"David J. Farber es un referente de la historia de las redes de computadoras, pero no se halló ninguna fuente que lo relacione con 802.16. Y sobre Steve Jobs no existe, en las fuentes consultadas, una declaración verificable sobre WiMAX; lo comprobable es que Apple nunca lanzó un iPhone con WiMAX y adoptó LTE. Se prefirió indicarlo así antes que inventar citas."},{k:"fact",t:"El algoritmo de Viterbi, creado a finales de los años sesenta para simplificar un curso universitario, terminó siendo la base de la decodificación en telefonía móvil, comunicaciones espaciales, reconocimiento de voz e incluso análisis de ADN."},{k:"gallery",imgs:[en.towerForest,en.cellTower,en.towerBlue]}]},to=[{id:"us",name:"Estados Unidos",flag:"🇺🇸",lat:39.8,lon:-98.5,operators:"Sprint (Xohm/CLEAR), Clearwire",period:"2008 – 2015 (red apagada en marzo de 2016)",peak:"≈11 millones de suscriptores (incl. mayoristas), enero de 2012",note:"88 mercados y 134 millones de personas cubiertas potencialmente. Primer smartphone: HTC EVO 4G (2010).",verified:!0},{id:"jp",name:"Japón",flag:"🇯🇵",lat:36.2,lon:138.2,operators:"UQ Communications (grupo KDDI)",period:"2009 en adelante",peak:"Más de la mitad de la población cubierta (2009)",note:"Más de 20 socios MVNO. Después evolucionó a WiMAX 2+, compatible con TD-LTE.",verified:!0},{id:"kr",name:"Corea del Sur",flag:"🇰🇷",lat:36.5,lon:127.9,operators:"KT (WiBro)",period:"2006 en adelante",peak:"≈150.000 abonados en el 1T 2008",note:"WiBro aportó tecnología al estándar; en 2009 KT cubría más de la mitad de la población.",verified:!0},{id:"ru",name:"Rusia",flag:"🇷🇺",lat:58,lon:50,operators:"Yota (Scartel)",period:"2007/2009 – 2012",peak:">300.000 abonados (febrero de 2010)",note:"Mayor red WiMAX móvil del mundo; migró a LTE desde 2011–2012.",verified:!0},{id:"in",name:"India",flag:"🇮🇳",lat:21,lon:78,operators:"BSNL, Tata Communications, otros",period:"2008 en adelante",peak:"Cifra consolidada no verificada",note:"BSNL planificó una gran red en Gujarat, Maharashtra, Goa y Andhra Pradesh (cerca de 400 localidades).",verified:!1},{id:"pk",name:"Pakistán",flag:"🇵🇰",lat:30.4,lon:69.3,operators:"Wateen, Qubee, Mobilink Infinity, Wi-Tribe",period:"2007 en adelante",peak:"25.000 abonados de Wateen (junio de 2008)",note:"Cuatro operadores WiMAX; Wateen pidió 198.000 CPE a Motorola.",verified:!0},{id:"my",name:"Malasia",flag:"🇲🇾",lat:4.2,lon:102,operators:"Packet One (P1)",period:"2008 en adelante",peak:"Cifra no verificada",note:"Citado por el WiMAX Forum como red en expansión en 2009.",verified:!1},{id:"au",name:"Australia",flag:"🇦🇺",lat:-25.3,lon:133.8,operators:"BigAir",period:"2000s – 2010s",peak:"Cifra no verificada",note:"ISP inalámbrico regional con WiMAX.",verified:!1},{id:"za",name:"Sudáfrica",flag:"🇿🇦",lat:-30.6,lon:22.9,operators:"Telkom («Do Broadband Wireless»), iBurst, Neotel",period:"2007 en adelante",peak:"Cifra no verificada",note:"Telkom lanzó WiMAX comercial en junio de 2007 en Pretoria, Johannesburgo, Durban y Ciudad del Cabo.",verified:!1},{id:"pe",name:"Perú",flag:"🇵🇪",lat:-9.2,lon:-75,operators:"Yota (licencia 2010)",period:"2010",peak:"Cifra no verificada",note:"En enero de 2010 Yota obtuvo espectro para una red nacional.",verified:!1},{id:"ni",name:"Nicaragua",flag:"🇳🇮",lat:12.9,lon:-85.2,operators:"Yota (piloto en Managua)",period:"2009 – 2010",peak:"Piloto",note:"Ofrecía datos ilimitados por unos 28 USD/mes, frente a ≈60 USD de la 3G local.",verified:!0},{id:"bo",name:"Bolivia",flag:"🇧🇴",lat:-16.5,lon:-64.7,operators:"Entel, COTAS, AXS (y otros)",period:"2008 en adelante",peak:"Sin cifra pública de abonados WiMAX",note:"Banda de 3,5 GHz. Entel anunció WiMAX en nueve capitales en octubre de 2008.",verified:!0}],Kx={slug:"cobertura-mundial",title:"Cobertura mundial: el mapa de WiMAX en cinco continentes",kicker:"Cobertura",summary:"519 despliegues en 146 países hacia 2009: de Baltimore a Moscú, de Seúl a La Paz. Explora el globo interactivo y compara los grandes mercados.",hero:en.nightCity,date:"2026-01-26",readMin:8,sources:[{label:"WiMAX Forum vía RF Globalnet: 519 despliegues en 146 países (2009)",url:"https://www.rfglobalnet.com/doc/wimax-deployments-go-global-with-519-in-146-0001"},{label:"Wikipedia: Clearwire (88 mercados, ≈11 M de suscriptores)",url:"https://en.wikipedia.org/wiki/Clearwire"},{label:"Samsung/Yota: 300.000 abonados en Rusia (feb. 2010)",url:"https://www.samsung.com/global/business/networks/insights/press-release/samsung-and-yota-accelerate-nationwide-mobile-wimax-deployment-in-russia/"},{label:"Maravedis vía Wireless Telecom: ≈25 M de abonados WiMAX (2011)",url:"https://wirelesstelecom.wordpress.com/2012/05/29/the-rise-and-fall-of-wimax-2/"},{label:"Fierce Broadband Wireless: KT y Wateen, primer trimestre de 2008",url:"https://www.southasiainvestor.com/2009/02/wimax-broadband-growing-in-pakistan.html"},{label:"Light Reading: WiMax — What's Working Now (BSNL, Telkom, Tata)",url:"https://www.lightreading.com/business-management/wimax-what-s-working-now"},{label:"ITWeb: Telkom unveils WiMax offerings (2007)",url:"https://www.itweb.co.za/article/telkom-unveils-wimax-offerings/KPNG8v8Xl85v4mwD"},{label:"OSIPTEL: Entel lanza WiMAX a tarifas promocionales (2008)",url:"https://www.gob.pe/institucion/osiptel/noticias/177600-entel-lanza-wimax-a-tarifas-promocionales"}],blocks:[{k:"p",t:"A finales de 2009, cuando el mundo aún debatía si WiMAX o LTE sería «el» estándar 4G, el WiMAX Forum contabilizaba 519 redes en 146 países, incluidas 95 desplegadas por operadores móviles 2G. Solo ese año se sumaron 112. Esa cifra explica por qué, durante un tiempo, WiMAX fue considerado la tecnología inalámbrica de banda ancha con más presencia global. Este artículo recorre sus mercados principales."},{k:"h2",t:"Norteamérica: el experimento de Sprint y Clearwire"},{k:"p",t:"Estados Unidos fue el mercado más grande y también el más visible. Sprint debutó con su servicio Xohm en Baltimore en 2008 —el lanzamiento estaba previsto para abril y se retrasó a septiembre— y luego lo integró en la marca CLEAR de Clearwire. Llegó a cubrir 88 mercados con 134 millones de personas dentro de su huella potencial y unos 11 millones de suscriptores a principios de 2012, cifra que incluye clientes mayoristas y de socios como cableoperadores."},{k:"p",t:"Otros actores más pequeños, como Towerstream, desplegaron WiMAX fijo 802.16e en varias ciudades para clientes empresariales. El desenlace es conocido: cierre de CLEAR el 6 de noviembre de 2015 y apagado total de la red en marzo de 2016."},{k:"h2",t:"Asia: donde WiMAX tuvo su mejor momento"},{k:"h3",t:"Corea del Sur y WiBro"},{k:"p",t:"Corea del Sur fue pionera con WiBro, variante coreana que alimentó el estándar. KT tenía cerca de 150.000 abonados en el primer trimestre de 2008 y hacia 2009 cubría más de la mitad de la población. Al igual que en otros mercados, Corea pasó después a LTE."},{k:"h3",t:"Japón: UQ Communications"},{k:"p",t:"UQ Communications, del grupo KDDI, cubría más de la mitad de Japón en 2009 y comercializaba servicio a través de más de 20 socios MVNO. Su evolución, WiMAX 2+, se hizo compatible con TD-LTE, una salida elegante que pocos operadores pudieron replicar."},{k:"h3",t:"India, Pakistán y Malasia"},{k:"p",t:"En el sur de Asia, WiMAX prometía saltarse la falta de infraestructura fija. BSNL, el operador estatal indio, planificó una red de escala enorme en varios estados, con casi 400 localidades. En Pakistán, cuatro operadores —Wateen, Qubee, Mobilink Infinity y Wi-Tribe— compitieron; Wateen tenía 25.000 abonados a mediados de 2008 tras ordenar 198.000 equipos de cliente. En Malasia, Packet One fue una de las redes citadas por el Foro en 2009."},{k:"img",img:en.kualaLumpur,caption:"Kuala Lumpur, sede de Packet One y de fabricantes como Greenpacket."},{k:"h2",t:"Europa y Rusia: Yota, la mayor red móvil"},{k:"p",t:"En Rusia, Yota (Scartel) construyó la mayor red de WiMAX móvil del mundo. Tenía 250.000 usuarios activos a finales de 2009, ganaba más de 2.300 abonados por día y en febrero de 2010 superaba los 300.000 en tres ciudades. Samsung le suministraría más de 5.000 estaciones base adicionales, con la meta de 180 ciudades. Sin embargo, la propia Yota anunció LTE en 2011 y en 2012 ya migraba sus clientes."},{k:"h2",t:"África: rellenar el hueco del ADSL"},{k:"p",t:"En Sudáfrica, Telkom lanzó en junio de 2007 «Do Broadband Wireless», su oferta WiMAX comercial, como alternativa al ADSL en zonas sin cobertura de cobre: Pretoria, Johannesburgo, Durban y Ciudad del Cabo, con planes de ampliarla a más de una docena de ciudades. Ese patrón —WiMAX como complemento del DSL— se repitió en Noruega, Alemania y otros países."},{k:"h2",t:"Latinoamérica: Bolivia, Perú y Nicaragua"},{k:"p",t:"En la región, WiMAX ocupó sobre todo la banda de 3,5 GHz. Yota probó suerte en Nicaragua y Perú en 2009–2010. Bolivia desplegó WiMAX con Entel desde octubre de 2008 y con COTAS desde 2009; ese caso se analiza en detalle en los dos artículos siguientes."},{k:"table",caption:"Grandes mercados WiMAX y cifras verificables",head:["País","Operador","Cifra citada","Fuente/fecha"],rows:[["EE. UU.","Clearwire/Sprint","≈11 M de suscriptores","Ene. 2012"],["Rusia","Yota",">300.000 abonados","Feb. 2010"],["Corea del Sur","KT","≈150.000 abonados","1T 2008"],["Pakistán","Wateen","25.000 abonados","Jun. 2008"],["Mundo","Todos","519 redes en 146 países","Dic. 2009"],["Mundo","Todos","≈25 M de abonados","Fin de 2011 (Maravedis)"]]},{k:"fact",t:"En 2008 el número medio de abonados por red WiMAX era de apenas unos 15.000. La fragmentación de miles de pequeños despliegues frenó la economía de escala de los dispositivos."},{k:"gallery",imgs:[en.colombo,en.rooftop,en.towers]}]},qM=[{dep:"La Paz",ciudad:"La Paz",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (HiperMAX)"},{dep:"Cochabamba",ciudad:"Cochabamba",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (HiperMAX)"},{dep:"Santa Cruz",ciudad:"Santa Cruz de la Sierra",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (HiperMAX)"},{dep:"Chuquisaca",ciudad:"Sucre",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (MicroMAX)"},{dep:"Tarija",ciudad:"Tarija",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (MicroMAX)"},{dep:"Oruro",ciudad:"Oruro",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (MicroMAX)"},{dep:"Potosí",ciudad:"Potosí",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (MicroMAX)"},{dep:"Beni",ciudad:"Trinidad",entel:"Sí (anunciado, oct. 2008)",cotas:"Sí (MicroMAX)"},{dep:"Pando",ciudad:"Cobija",entel:"Sí (anunciado, oct. 2008)",cotas:"No mencionado"}],Jx={slug:"wimax-bolivia",title:"WiMAX en Bolivia: banda ancha inalámbrica en los Andes",kicker:"Bolivia",summary:"Cronología, espectro de 3,5 GHz, cobertura por departamento y el camino hacia LTE y 5G de una tecnología que prometía vencer la geografía boliviana.",hero:en.laPaz,date:"2026-02-02",readMin:10,sources:[{label:"OSIPTEL: «Entel lanza WiMAX a tarifas promocionales» (2 oct. 2008)",url:"https://www.gob.pe/institucion/osiptel/noticias/177600-entel-lanza-wimax-a-tarifas-promocionales"},{label:"Entel Bolivia: Internet WiMAX (No vigente comercialmente)",url:"https://institucional.entel.bo/inicio3.0/index.php/internet/nuestros-servicios/internet-4g/27-personas-internet/personas-internet-otros"},{label:"Entel Bolivia: Términos y condiciones del servicio de Internet",url:"https://institucional.entel.bo/inicio3.0/files/ENT%2053639-3TyCInternetV400.pdf"},{label:"Developing Telecoms: Airspan seleccionada por COTAS (29 oct. 2009)",url:"https://developingtelecoms.com/telecom-technology/wireless-networks/2306-airspan-selected-by-cotas-for-multi-city-wimax-network-in-bolivia.html"},{label:"Campero: Infraestructura de telecomunicaciones y TIC en Bolivia (con datos ATT, dic. 2015)",url:"https://internetbolivia.org/wp-content/uploads/2017/05/Campero-merged.pdf"},{label:"Fundación Internet Bolivia: Economía Digital en Bolivia (datos ATT a sept. 2018)",url:"https://internetbolivia.org/file/2020/05/fd_economia-digital_final.pdf"},{label:"BNamericas: Bolivia to assign 3.5GHz spectrum to Entel (marzo 2025)",url:"https://www.bnamericas.com/en/news/bolivia-to-assign-35ghz-spectrum-to-state-operator-entel"},{label:"UIT-D: Banda ancha en los países andinos (2014)",url:"https://www.itu.int/dms_pub/itu-d/opb/pref/D-PREF-EF.BB.ANDEAN-2014-PDF-S.pdf"},{label:"Prepaid Data SIM Card Wiki: redes 4G/LTE en Bolivia",url:"https://prepaid-data-sim-card.fandom.com/wiki/Bolivia"}],blocks:[{k:"p",t:"Bolivia es un país donde la geografía impone sus reglas: cordilleras a más de 4.000 metros, altiplano abierto, valles y llanos amazónicos. Tender fibra o cobre hasta cada comunidad es costosísimo, y por eso las promesas de WiMAX —alcance de kilómetros sin línea de vista, instalación rápida y sin zanjas— encajaban de forma natural con la realidad boliviana. Este artículo reconstruye qué se desplegó, cuándo, con qué frecuencias y qué quedó de aquello."},{k:"h2",t:"Contexto regulatorio y cronología"},{k:"p",t:"El sector telecom boliviano fue regulado por la Superintendencia de Telecomunicaciones (SITTEL) hasta que, en 2009, la Autoridad de Regulación y Fiscalización de Telecomunicaciones y Transportes (ATT) asumió sus funciones. Ese es el marco en el que aterrizó WiMAX. El año 2008 es clave por otro motivo: en mayo el Estado recuperó el control de Entel, la mayor empresa del país, que pasó a ser un actor estatal con mandato de ampliar la cobertura."},{k:"table",caption:"Cronología documentada de WiMAX en Bolivia",head:["Año","Hito","Fuente"],rows:[["2000–2001","Nace AXS Bolivia; en 2001 abre su propia salida de fibra a cables submarinos","AXS / El Deber"],["Oct. 2008","Entel anuncia el servicio Internet WiMAX para nueve ciudades capitales","OSIPTEL (2 oct. 2008)"],["2009","La ATT reemplaza a la SITTEL como regulador","Marco regulatorio"],["Oct. 2009","COTAS elige a Airspan para una red WiMAX en 3,5 GHz en ocho ciudades","Developing Telecoms"],["2013–2015","Llegada del 4G/LTE: Tigo (2013), Entel y Viva (2015 en La Paz)","Prepaid Data SIM Card Wiki"],["2015","ATT reporta más de 6,5 millones de conexiones a Internet en el país","Campero (2017)"],["2017","El informe de Fundación Internet Bolivia cita a Entel como principal proveedor WiMAX, con servicio algo inestable","Campero (2017)"],["Mar. 2025","La ATT asigna 3,5 GHz a Entel para iniciar el 5G","BNamericas"]]},{k:"img",img:en.laPazHills,caption:"Las laderas de La Paz: terreno accidentado donde la radio compite con el cable."},{k:"h2",t:"Frecuencias: la banda de 3,5 GHz"},{k:"p",t:"El servicio de Entel funcionó sobre el estándar IEEE 802.16e (WiMAX móvil) en la banda de 3,5 GHz, según su propia documentación comercial. COTAS eligió también 3,5 GHz para su red con equipos Airspan. Esa banda —perfil de 3,4 a 3,6 GHz del WiMAX Forum, con licencias entre 3,3 y 3,8 GHz en muchos países— fue la más usada por WiMAX en América Latina."},{k:"p",t:"Nota de transparencia: durante la investigación no se encontró una resolución administrativa pública de la ATT que detalle los bloques exactos de espectro asignados a cada operador para WiMAX. Por ello este blog no publica rangos precisos por empresa. Lo que sí puede afirmarse es que la misma banda de 3,5 GHz es hoy el eje del 5G: en marzo de 2025 BNamericas informó que la ATT empezaba la implementación 5G del país asignándola a Entel."},{k:"h2",t:"Cobertura departamental"},{k:"p",t:"El anuncio de octubre de 2008 incluía las nueve ciudades capitales de departamento, es decir, cobertura urbana en todo el país. COTAS, por su parte, planificó estaciones de alta capacidad (HiperMAX) en Santa Cruz, La Paz y Cochabamba y estaciones más pequeñas (MicroMAX) en Sucre, Tarija, Trinidad, Oruro y Potosí. La tabla resume lo documentado; los anuncios reflejan planes y no equivalen a la cobertura efectiva alcanzada."},{k:"table",caption:"Ciudades incluidas en anuncios de WiMAX (Entel 2008, COTAS 2009)",head:["Departamento","Ciudad","Entel","COTAS"],rows:qM.map(i=>[i.dep,i.ciudad,i.entel,i.cotas])},{k:"h3",t:"Los planes comerciales de Entel"},{k:"p",t:"La página histórica de Entel, hoy marcada como «No vigente comercialmente», conserva las tarifas planas de su Internet WiMAX. Iban de 128 kbps por 160 Bs mensuales hasta 2.048 kbps por 1.590 Bs, según factibilidad técnica. El equipo de cliente (CPE) podía prestarse contra una garantía de 150 Bs, y el servicio ofrecía portabilidad (no era solo fijo)."},{k:"table",caption:"Planes de Internet WiMAX de Entel (documento comercial histórico)",head:["Plan","Velocidad hasta","Tarifa mensual"],rows:[["BAI-100","128 kbps","Bs 160"],["BAI-200","256 kbps","Bs 220"],["BAI-400","512 kbps","Bs 450"],["BAI-500","768 kbps","Bs 630"],["BAI-700","1.024 kbps","Bs 900"],["BAI-800","1.536 kbps","Bs 1.250"],["BAI-900","2.048 kbps","Bs 1.590"]]},{k:"quote",t:"WiMAX: acceso inalámbrico, que puede incluir la posibilidad de movilidad del usuario. A pesar de que se pueden alcanzar altas velocidades, en la práctica se ha demostrado que el servicio es algo inestable por las condiciones de propagación inalámbrica. El principal proveedor de este servicio es Entel.",by:"Campero, «Infraestructura de telecomunicaciones y TIC en Bolivia» (2017)"},{k:"h2",t:"Impacto social en zonas rurales"},{k:"p",t:"Kurt Klein, gerente de Planificación e Ingeniería de COTAS, lo dijo al anunciar su red: el equipo elegido permitía «superar algunos de los desafíos del terreno accidentado que enfrentamos en Bolivia» y llegar tanto a clientes urbanos como rurales. Esa era la promesa social: conectar escuelas, postas de salud y pequeñas empresas donde ADSL no llegaba."},{k:"p",t:"La realidad, según los datos disponibles, fue más modesta. Los planes de 2008 eran caros para el ingreso medio (Bs 160 por 128 kbps) y los primeros despliegues se concentraron en capitales. La conectividad rural masiva llegó realmente con la telefonía móvil 3G/4G: hacia 2018, tres departamentos —Santa Cruz, La Paz y Cochabamba— concentraban el 75 % de todas las conexiones de Internet del país, mientras los otros seis se repartían el 25 %. Esa brecha explica por qué el 4G rural y los programas de conectividad siguen siendo prioridad."},{k:"img",img:en.condoriri,caption:"Comunidades altoandinas: el reto que WiMAX quiso resolver con radio en lugar de cable."},{k:"h2",t:"Estado actual: migración a LTE y 5G"},{k:"p",t:"Entel indica que su Internet WiMAX ya no se comercializa. Entre 2013 y 2015, los tres operadores móviles —Tigo, Entel y Viva— lanzaron 4G LTE, con Tigo primero (2013) y Viva último (verano de 2015 en La Paz). LTE ofrecía mejores velocidades y un ecosistema de teléfonos que WiMAX nunca tuvo en la región. Paralelamente, AXS, COTAS y COMTECO fortalecieron fibra óptica y cable."},{k:"p",t:"El círculo se cierra con el 5G: la banda de 3,5 GHz que sirvió a WiMAX vuelve a ser protagonista, ahora con Entel como primer beneficiario de su asignación en 2025. Para Bolivia, WiMAX fue un peldaño: una demostración temprana de que la radio podía ser la vía más rápida hacia la conectividad en un territorio difícil."},{k:"fact",t:"AXS Bolivia, en 2001, rompió un monopolio al establecer su propia salida de fibra óptica hacia los cables submarinos, y en 2019 fue el proveedor fijo más rápido del país según nPerf: 12,97 Mbps de descarga, 5,91 Mbps de subida y 143 ms de latencia."},{k:"gallery",imgs:[en.laPazCable,en.huayna,en.tarata]}]},jM=[{id:"entel",nombre:"Entel (Entel WiMAX)",tipo:"Empresa estatal (recuperada en 2008)",fundada:"Estatal desde 2008",wimax:"Anuncio del servicio en octubre de 2008. Estándar 802.16e, banda de 3,5 GHz.",cobertura:"Nueve capitales: La Paz, Cochabamba, Santa Cruz, Sucre, Tarija, Oruro, Potosí, Trinidad y Cobija (anuncio de 2008).",velocidades:"128 kbps a 2.048 kbps (Bs 160 a Bs 1.590 mensuales)",estado:"«No vigente comercialmente». Hoy: 4G LTE (700 MHz) y primera asignación de 3,5 GHz para 5G (2025).",evidencia:"Confirmado",color:"from-indigo-500 to-cyan-400",mono:"EN"},{id:"cotas",nombre:"COTAS",tipo:"Cooperativa (Santa Cruz)",fundada:"1960",wimax:"En octubre de 2009 eligió a Airspan (HiperMAX y MicroMAX) para una red WiMAX en 3,5 GHz con servicios triple play.",cobertura:"HiperMAX en Santa Cruz, La Paz y Cochabamba; MicroMAX en Sucre, Tarija, Trinidad, Oruro y Potosí.",velocidades:"No se halló tarifario público verificable de su servicio WiMAX.",estado:"Estado del servicio WiMAX no confirmado. Hoy ofrece Internet, TV por cable y telefonía fija.",evidencia:"Confirmado",color:"from-cyan-400 to-emerald-400",mono:"CO"},{id:"axs",nombre:"AXS Bolivia",tipo:"Empresa privada (La Paz)",fundada:"2000",wimax:"Su portafolio de banda ancha incluye ADSL, WiMAX y GPON según su perfil comercial.",cobertura:"Oficinas en La Paz, Cochabamba y Santa Cruz; presencia nacional con su código de larga distancia «11».",velocidades:"Tarifario 2017 (tecnología no especificada): 192 kbps a 1.792 kbps, desde Bs 300.",estado:"Orientada hoy a fibra óptica/GPON. En 2019 fue el proveedor fijo más rápido: 12,97 Mbps de descarga (nPerf).",evidencia:"Parcial",color:"from-fuchsia-500 to-indigo-500",mono:"AX"},{id:"comteco",nombre:"COMTECO",tipo:"Cooperativa (Cochabamba)",fundada:"1942",wimax:"No se halló evidencia pública verificable de un despliegue WiMAX masivo.",cobertura:"Cochabamba y alrededores, con más de 100.000 abonados.",velocidades:"ADSL, VDSL, HFC y fibra; 8,69 Mbps de descarga media en 2019 (nPerf).",estado:"Referente cooperativo de banda ancha fija y móvil. El uso de WiMAX es un dato pendiente de confirmar.",evidencia:"No verificado",color:"from-amber-400 to-pink-500",mono:"CM"},{id:"viva",nombre:"Viva (NuevaTel PCS)",tipo:"Operador móvil privado",fundada:"Grupo Trilogy International",wimax:"No se halló evidencia pública de un servicio WiMAX comercial; su negocio se centró en 2G/3G/4G.",cobertura:"Nacional móvil; 4G LTE lanzado en verano de 2015 (área de La Paz).",velocidades:"Tarifario 2017 de acceso (tecnología no especificada): 328 kbps a 2 Mbps.",estado:"Operador móvil con 4G en banda AWS (1700 MHz).",evidencia:"No verificado",color:"from-pink-500 to-orange-400",mono:"VI"},{id:"tigo",nombre:"Tigo (Millicom)",tipo:"Operador móvil privado (histórico: Telecel)",fundada:"Grupo Millicom",wimax:"No se halló evidencia pública de un servicio WiMAX propio en Bolivia.",cobertura:"Nacional; primer operador en lanzar 4G/LTE (2013) y con al menos una ciudad 4G por departamento.",velocidades:"Tarifario 2017 de acceso (tecnología no especificada): 160 kbps a 1.536 kbps.",estado:"Segundo operador móvil; Internet hogar (cable/fibra) y 4G, con 5G en expansión.",evidencia:"No verificado",color:"from-sky-400 to-indigo-600",mono:"TG"},{id:"coops",nombre:"Cooperativas y operadores regionales",tipo:"15 cooperativas de telecomunicaciones",fundada:"Varias décadas",wimax:"Cooperativas como COTEL (La Paz) tienen convenios con AXS para el transporte de Internet; los usos de WiMAX son dispares.",cobertura:"Localidades urbanas y periurbanas de cada departamento.",velocidades:"Variable según proveedor.",estado:"Modelo social nacido con COTAS (1960). Sin inventario público de despliegues WiMAX.",evidencia:"No verificado",color:"from-emerald-400 to-cyan-500",mono:"CP"}],Qx={slug:"empresas-bolivia",title:"Empresas que aplicaron WiMAX en Bolivia",kicker:"Empresas",summary:"Entel, COTAS, AXS y otras: qué hizo cada operador, con qué velocidades, dónde y qué quedó. Con nivel de evidencia para cada dato.",hero:en.towerDish,date:"2026-02-09",readMin:8,sources:[{label:"Entel Bolivia: Internet WiMAX (No vigente comercialmente)",url:"https://institucional.entel.bo/inicio3.0/index.php/internet/nuestros-servicios/internet-4g/27-personas-internet/personas-internet-otros"},{label:"Developing Telecoms: COTAS y Airspan (2009)",url:"https://developingtelecoms.com/telecom-technology/wireless-networks/2306-airspan-selected-by-cotas-for-multi-city-wimax-network-in-bolivia.html"},{label:"AXS Bolivia: Quiénes somos",url:"https://www.axsbolivia.com/quienes-somos/"},{label:"El Deber: AXS celebra 25 años",url:"https://eldeber.com.bo/te-puede-interesar/axs-celebra-25-anos-conectando-bolivia-y-transformando-la-vida-digital-del-pais_522360/"},{label:"DPL News / nPerf 2019: mejor proveedor de Internet fijo de Bolivia",url:"https://dplnews.com/este-es-el-proveedor-con-mejor-conexion-a-internet-fijo-de-bolivia/"},{label:"Campero (2017): Infraestructura de telecomunicaciones y TIC en Bolivia",url:"https://internetbolivia.org/wp-content/uploads/2017/05/Campero-merged.pdf"},{label:"Fundación Internet Bolivia: Economía Digital (2020)",url:"https://internetbolivia.org/file/2020/05/fd_economia-digital_final.pdf"},{label:"Rejnac: perfiles de proveedores (COTAS, COMTECO, Tigo, Viva)",url:"https://rejnac.com/internet-providers-in-bolivia"}],blocks:[{k:"p",t:"Bolivia tiene un ecosistema de telecomunicaciones singular: un gigante estatal, dos operadores móviles privados, un puñado de empresas de datos y unas quince cooperativas que nacieron como servicios comunitarios de teléfonos. Cuando WiMAX apareció, cada uno reaccionó a su manera. Este artículo separa con rigor lo que está documentado de lo que solo se supone, y usa una etiqueta de evidencia —Confirmado, Parcial o No verificado— en cada tarjeta de empresa."},{k:"h2",t:"Entel: el operador que llevó WiMAX a las nueve capitales"},{k:"p",t:"Entel es la empresa con el vínculo más claro. Tras su recuperación por el Estado en 2008, la compañía anunció el 2 de octubre de ese año su servicio de Internet WiMAX para La Paz, Cochabamba, Santa Cruz, Sucre, Tarija, Oruro, Potosí, Trinidad y Cobija, con tarifas promocionales. Su documentación describe un acceso inalámbrico asimétrico de banda ancha sobre IEEE 802.16e a 3,5 GHz, sin necesidad de instalación y con equipo terminal (CPE) portable."},{k:"p",t:"Los planes iban de 128 kbps (Bs 160) a 2.048 kbps (Bs 1.590). Los términos y condiciones aclaran que la velocidad quedaba sujeta a factibilidad técnica. En 2017, un estudio sobre infraestructura TIC en Bolivia señalaba que Entel era el principal proveedor de WiMAX del país y que el servicio podía resultar algo inestable por las condiciones de propagación."},{k:"h2",t:"COTAS: la cooperativa cruceña y su apuesta con Airspan"},{k:"p",t:"La Cooperativa de Telecomunicaciones Santa Cruz (COTAS) fue fundada en 1960 y es un caso de estudio del modelo cooperativo. En octubre de 2009 el fabricante Airspan anunció que COTAS, descrita como la segunda mayor proveedora de telecomunicaciones del país, había elegido sus soluciones WiMAX certificadas (MicroMAX y HiperMAX) para una red de banda ancha en 3,5 GHz."},{k:"p",t:"El plan cubría con estaciones HiperMAX las regiones de Santa Cruz, La Paz y Cochabamba, y con MicroMAX otras cinco ciudades: Sucre, Tarija, Trinidad, Oruro y Potosí. Kurt Klein, gerente de Planificación e Ingeniería, subrayó que el equipo podía alcanzar tanto a clientes urbanos como rurales pese al terreno accidentado. No se encontró un tarifario público de ese servicio, por lo que no se citan velocidades."},{k:"img",img:en.towerDrone,caption:"Las estaciones base en torres altas eran la clave para cubrir valles y laderas."},{k:"h2",t:"AXS Bolivia: pionera de larga distancia y datos"},{k:"p",t:"AXS nació en 2000 y en noviembre de 2001, con la apertura del mercado, fue el único operador de larga distancia con presencia en las nueve capitales a través del código 11. Ese mismo año rompió el monopolio de acceso internacional al establecer una salida propia de fibra hacia cables submarinos. Su perfil comercial enumera Internet de banda ancha por ADSL, WiMAX y GPON, aunque no se hallaron detalles de cobertura WiMAX ni de velocidades propias."},{k:"p",t:"En la medición de nPerf de 2019, con 77.472 pruebas a los cinco mayores proveedores fijos, AXS fue el más rápido con 12,97 Mbps de descarga, seguido de Entel (9,69), COMTECO (8,69), COTAS (8,54) y Tigo (8,45 Mbps)."},{k:"table",caption:"nPerf 2019: Internet fijo en Bolivia (77.472 pruebas)",head:["Proveedor","Descarga (Mbps)","Subida (Mbps)","Latencia (ms)"],rows:[["AXS","12,97","5,91","143,23"],["Entel","9,69","4,96","166,27"],["COMTECO","8,69","3,69","156,88"],["COTAS","8,54","2,88","196,56"],["Tigo","8,45","2,51","205,81"]]},{k:"h2",t:"COMTECO, Viva, Tigo y las cooperativas"},{k:"p",t:"COMTECO, fundada en 1942 en Cochabamba, es el principal proveedor de Internet de esa ciudad, con más de 100.000 abonados, y ofrece ADSL, VDSL, HFC y fibra. Viva (NuevaTel PCS, del grupo Trilogy) y Tigo (Millicom) son operadores móviles: Tigo lanzó el primer 4G LTE del país en 2013 y Viva fue el último en 2015. Para estas tres empresas no se halló evidencia pública verificable de despliegues WiMAX propios, y por eso aparecen como «No verificado» en las tarjetas."},{k:"p",t:"Finalmente, Bolivia cuenta con unas quince cooperativas de telecomunicaciones, entre las que destacan COTAS y COMTECO. Algunas, como COTEL, tienen convenios con AXS para el transporte de Internet. Sin un inventario público de despliegues WiMAX en cooperativas rurales, este blog prefiere no listar nombres que no pueda respaldar."},{k:"h2",t:"Comparativa y lecciones"},{k:"table",caption:"Comparativa de operadores y su relación con WiMAX",head:["Empresa","Fundación / origen","WiMAX documentado","Estado actual"],rows:[["Entel","Estatal, 2008","2008 · 9 capitales · 3,5 GHz","Sin comercializar; 4G y 5G"],["COTAS","1960 · cooperativa","2009 · 8 ciudades · 3,5 GHz","Internet, cable y telefonía"],["AXS","2000","Incluido en portafolio","Fibra / GPON"],["COMTECO","1942 · cooperativa","No verificado","ADSL, HFC y fibra"],["Viva","Trilogy","No verificado","4G desde 2015"],["Tigo","Millicom","No verificado","4G desde 2013"]]},{k:"p",t:"La lección común es clara: WiMAX abrió el camino de la banda ancha inalámbrica en Bolivia, pero fue un capítulo breve. La combinación de equipos caros, planes de baja velocidad y la irrupción del 4G LTE con teléfonos económicos empujó a todos hacia otra tecnología. Lo que perdura es la infraestructura de torres y, sobre todo, la banda de 3,5 GHz."},{k:"fact",t:"Bolivia tiene unas 15 cooperativas de telecomunicaciones: un modelo social que COTAS, fundada en 1960, implantó y que otros departamentos replicaron rápidamente."},{k:"gallery",imgs:[en.laPazMarket,en.stadium,en.chapel]}]},ts="Calle Cucho Josue Salomon",eS="Estudiante de Sistemas Informáticos, INCOS El Alto",yl=[Yx,$x,Kx,Jx,Qx],Wh=i=>`/blog/${i.slug}`,ZM=i=>[...yl].sort((e,n)=>n.date.localeCompare(e.date)).slice(0,i),tS=[],nS=i=>new Date(i+"T12:00:00").toLocaleDateString("es-BO",{year:"numeric",month:"long",day:"numeric"}),qh=[{to:"/",label:"Inicio"},{to:"/blog/historia",label:"Historia"},{to:"/blog/personajes",label:"Personajes"},{to:"/blog/cobertura-mundial",label:"Cobertura"},{to:"/blog/wimax-bolivia",label:"WiMAX Bolivia"},{to:"/blog/empresas-bolivia",label:"Empresas"},{to:"/about",label:"Sobre el autor"},{to:"/contact",label:"Contacto"}];function YM(){return w.jsxs(Oi,{to:"/",className:"flex items-center gap-2.5 font-display text-lg font-bold","aria-label":"ZenithSpace — ir al inicio",children:[w.jsx("span",{"aria-hidden":"true",className:"grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-nebula via-cosmic to-galaxy shadow-[0_0_24px_rgba(99,102,241,.6)]",children:w.jsx("svg",{viewBox:"0 0 24 24",className:"h-5 w-5",fill:"none",stroke:"#fff",strokeWidth:"3",strokeLinecap:"round",strokeLinejoin:"round",children:w.jsx("path",{d:"M5 6h14L7 18h12"})})}),w.jsxs("span",{children:["Zenith",w.jsx("span",{className:"text-cosmic",children:"Space"})]})]})}function $M(){const[i,e]=ht.useState(!1),[n,r]=ht.useState(!1),o=Yp();return ht.useEffect(()=>e(!1),[o]),ht.useEffect(()=>{document.documentElement.dataset.theme=n?"light":"dark",document.querySelector('meta[name="theme-color"
